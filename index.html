ace-between;gap:12px}.stat{font-size:26px;font-weight:1000;color:#d8ff48}.card h2,.card h3{margin-top:0}.option{display:block;width:100%;text-align:left;background:#232f53;color:white;border:1px solid #415485;padding:15px 17px;border-radius:12px;margin:8px 0}.option:hover:not(:disabled){border-color:#d8ff48}.option.correct{background:#174f51;border-color:#6effab}.option.wrong{background:#64273f;border-color:#ff6c8d}.question{font-size:clamp(22px,3vw,31px);font-weight:900;margin:16px 0 24px}.answer{width:100%;background:#0e1732;border:1px solid #5770ad;border-radius:12px;color:#fff;padding:15px;outline:none;font-size:18px}.answer:focus{border-color:#d8ff48}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.chip{border:1px solid #5c709d;background:#253256;color:white;border-radius:9px;padding:8px 12px;font-weight:700}.feedback{padding:16px;border-radius:15px;background:#243457;margin-top:16px}.good{border-left:5px solid #79f5ad}.bad{border-left:5px solid #ff7b99}.bar{height:12px;background:#303d62;border-radius:20px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#58c3ff,#d8ff48);border-radius:20px}.avatar{font-size:44px;display:block}.choose{border:2px solid #475a88;background:#222e50;border-radius:16px;padding:15px;min-width:130px;text-align:center;color:#fff}.choose.sel{border-color:#d8ff48;background:#334c59}.choicegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mini{padding:15px;border-radius:14px;background:#202b4a}.labels{display:flex;justify-content:space-between;margin:6px 0;font-size:13px}.chart{width:100%;height:185px}.legend{color:#b7c6ee;font-size:12px}.foot{font-size:12px;color:#8d9bc5;text-align:center;margin:25px}.divider{height:1px;background:#354263;margin:16px 0}select{background:#111b38;color:#fff;border:1px solid #5d73a5;padding:12px;border-radius:10px;width:100%}label{display:block;margin:10px 0;font-weight:700}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:740px){.grid,.two{grid-template-columns:1fr}.choicegrid{grid-template-columns:repeat(3,1fr)}.choose{min-width:0;padding:10px 4px}.card{padding:18px}.hero{padding:24px}.logo{font-size:17px}}
</style></head><body><main id="app"></main><script>
const KEY='bruno-battle-v1';const empty=()=>({name:'Bruno',avatar:'🥷',xp:0,streak:0,maxStreak:0,answers:[],sessions:[],chapter:1});let db;try{db={...empty(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{db=empty()}let state={page:'home',mode:'battle',queue:[],pos:0,answered:false,typed:'',pick:null,session:null,filter:'all',target:'all'};const $=s=>document.querySelector(s),save=()=>localStorage.setItem(KEY,JSON.stringify(db)),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const normalize=s=>String(s).toLocaleLowerCase('fr').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim();const shuffle=a=>[...a].sort(()=>Math.random()-.5);const wordBank=[
{id:'bonjour',fr:'bonjour',de:'guten Tag',sentence:'Bonjour, Léo !',hint:'Bon = gut; jour = Tag.'},
{id:'salut',fr:'salut',de:'hallo',sentence:'Salut, Camille !',hint:'Salut ist ein lockerer Gruß unter Freunden.'},
{id:'merci',fr:'merci',de:'danke',sentence:'Merci, Emma !',hint:'Merci klingt wie „Mersi“.'},
{id:'oui',fr:'oui',de:'ja',sentence:'Oui, c’est Léo.',hint:'Oui klingt ähnlich wie „wi“.'},
{id:'non',fr:'non',de:'nein',sentence:'Non, ce n’est pas Léo.',hint:'Non ist das Gegenteil von oui.'},
{id:'je',fr:'je',de:'ich',sentence:'Je suis Max.',hint:'Je ist das französische „ich“.'},
{id:'tu',fr:'tu',de:'du',sentence:'Tu es sympa.',hint:'Tu wird für eine Person benutzt, die du duzt.'},
{id:'un',fr:'un',de:'ein (männlich)',sentence:'C’est un garçon.',hint:'Un begleitet männliche Nomen.'},
{id:'une',fr:'une',de:'eine (weiblich)',sentence:'C’est une fille.',hint:'Une begleitet weibliche Nomen.'},
{id:'fille',fr:'une fille',de:'ein Mädchen',sentence:'C’est une fille.',hint:'Fille hat im Französischen den weiblichen Artikel une.'},
{id:'garcon',fr:'un garçon',de:'ein Junge',sentence:'C’est un garçon.',hint:'Die Cedille in garçon zeigt das weiche s an.'},
{id:'comment',fr:'comment',de:'wie',sentence:'Comment tu t’appelles ?',hint:'Comment fragt nach dem Wie.'},
{id:'ca',fr:'ça va',de:'wie geht’s / es geht',sentence:'Salut ! Ça va ?',hint:'Ça va? ist eine typische Frage unter Freunden.'},
{id:'aurevoir',fr:'au revoir',de:'auf Wiedersehen',sentence:'Au revoir, Léo !',hint:'Revoir erinnert an Wiedersehen.'},
{id:'ecole',fr:'l’école',de:'die Schule',sentence:'Je suis à l’école.',hint:'École: Das é ist ein accent aigu.'},
{id:'cest',fr:'c’est',de:'das ist',sentence:'C’est Emma.',hint:'C’est entsteht aus ce + est; das e fällt weg.'},
{id:'prof',fr:'le professeur',de:'der Lehrer / die Lehrerin',sentence:'C’est le professeur.',hint:'Professeur erinnert an Professor.'},
{id:'ami',fr:'un ami',de:'ein Freund',sentence:'C’est un ami.',hint:'Ami erinnert an das englische amicable (freundlich).'},
{id:'amie',fr:'une amie',de:'eine Freundin',sentence:'C’est une amie.',hint:'Amie bezeichnet hier eine Freundin.'}
];
// Original exercises, aligned to early greeting/classroom content. Confirm exact edition/chapter assignment separately.
const grammar=[
{id:'g1',type:'mc',category:'Grammatik',level:1,prompt:'Was bedeutet „c’est“?',options:['Das ist','Du bist','Ich habe','Wir sind'],answer:'Das ist',tip:'ce + est → c’est: vor einem Vokal wird das e ausgelassen.'},
{id:'g2',type:'text',category:'Grammatik',level:2,prompt:'Ergänze: „C’___ Léo.“',answer:'est',tip:'C’est bedeutet „Das ist“.'},
{id:'g3',type:'mc',category:'Grammatik',level:2,prompt:'Welche Kombination ist richtig?',options:['un fille','une fille','une garçon','un école'],answer:'une fille',tip:'Fille wird mit dem weiblichen Artikel une verwendet.'},
{id:'g4',type:'order',category:'Grammatik',level:2,prompt:'Ordne die Wörter: „Das ist ein Junge.“',tokens:['garçon','un','C’est'],answer:'C’est un garçon',tip:'Erst c’est, dann un, dann garçon.'},
{id:'g5',type:'mc',category:'Grammatik',level:2,prompt:'Warum steht in „l’école“ ein Apostroph?',options:['Weil le/la vor Vokal zu l’ wird','Weil école männlich ist','Weil es Plural ist','Weil es eine Frage ist'],answer:'Weil le/la vor Vokal zu l’ wird',tip:'La école wird zu l’école.'},
{id:'g6',type:'text',category:'Grammatik',level:3,prompt:'Übersetze: „Das ist eine Freundin.“',answer:'C’est une amie',alternatives:["C'est une amie"],tip:'C’est + une + amie: Hier brauchst du une.'},
{id:'g7',type:'mc',category:'Transfer',level:3,prompt:'Du stellst deine Freundin Emma vor. Was passt?',options:['C’est Emma.','Je Emma.','Tu Emma.','Un Emma.'],answer:'C’est Emma.',tip:'Nutze c’est, um jemanden vorzustellen.'},
{id:'g8',type:'text',category:'Transfer',level:3,prompt:'Du siehst einen Jungen. Schreibe: „Das ist ein Junge.“',answer:'C’est un garçon',tip:'Männlicher Artikel un; garçon = Junge.'},
{id:'g9',type:'order',category:'Transfer',level:3,prompt:'Baue einen französischen Satz: „Das ist meine Schule“ – verwende hier: „Das ist die Schule.“',tokens:['l’école','C’est'],answer:'C’est l’école',tip:'C’est + l’école. „Meine Schule“ wäre „mon école“ – das üben wir später.'},
{id:'g10',type:'mc',category:'Transfer',level:2,prompt:'Welche Antwort passt auf „Ça va ?“',options:['Oui, ça va !','Au revoir.','Un garçon.','L’école.'],answer:'Oui, ça va !',tip:'Auf „Wie geht’s?“ kann man mit „Oui, ça va !“ antworten.'},
{id:'g11',type:'text',category:'Grammatik',level:2,prompt:'Ergänze den weiblichen Artikel: ___ amie',answer:'une',tip:'Une amie = eine Freundin.'},
{id:'g12',type:'mc',category:'Transfer',level:3,prompt:'Du triffst morgens einen Lehrer. Welche Begrüßung ist passend?',options:['Bonjour !','Au revoir !','Non !','Une fille !'],answer:'Bonjour !',tip:'Bonjour ist eine höfliche Begrüßung.'},
];
const deck=()=>{let w=wordBank.flatMap(v=>[{id:v.id+'-fr',type:'text',category:'Vokabeln',level:2,prompt:`Übersetze ins Französische: „${v.de}“`,answer:v.fr,tip:v.hint+' Beispiel: '+v.sentence},{id:v.id+'-de',type:'mc',category:'Vokabeln',level:1,prompt:`Was bedeutet „${v.fr}“?`,answer:v.de,options:shuffle([v.de,...shuffle(wordBank.filter(x=>x.id!==v.id&&x.de!==v.de)).slice(0,3).map(x=>x.de)]),tip:v.sentence+' · '+v.hint}]);return [...w,...grammar]};const all=deck();const latest=id=>db.answers.filter(a=>a.id===id).at(-1);const missed=()=>[...new Set(db.answers.filter(a=>!a.correct).map(a=>a.id))].filter(id=>latest(id)?.correct===false);const stats=()=>({total:db.answers.length,correct:db.answers.filter(a=>a.correct).length,rate:db.answers.length?Math.round(db.answers.filter(a=>a.correct).length/db.answers.length*100):0});
function shell(content){$('#app').innerHTML=`<header class="top"><div class="logo">⚡ BRUNO <em>BATTLE</em></div><div class="pill">${esc(db.avatar)} ${esc(db.name)} · ⭐ ${db.xp} XP</div></header><nav class="nav"><button class="${state.page==='home'?'on':''}" data-nav="home">🏠 Arena</button><button class="${state.page==='grammar'?'on':''}" data-nav="grammar">📘 Grammatik</button><button class="${state.page==='stats'?'on':''}" data-nav="stats">📈 Stats</button><button class="${state.page==='settings'?'on':''}" data-nav="settings">⚙️ Profil</button></nav>${content}<p class="foot">V1 · Lernstand Unité 1 · Lokal gespeichert · Kein KI-Verbrauch im Spiel · Kein offizielles Cornelsen-Produkt</p>`;document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav))}
function go(page){state.page=page;render()}function render(){if(state.page==='home')return home();if(state.page==='grammar')return grammarPage();if(state.page==='stats')return statsPage();if(state.page==='settings')return settings();if(state.page==='play')return play();if(state.page==='result')return result()}
function home(){let s=stats();shell(`<section class="card hero"><span class="tag">🎯 À plus! 1 · Unité 1</span><h1>READY FOR<br>THE BATTLE?</h1><p>Trainiere Wörter, Grammatik und echte Anwendung. Besiege deine Gegner und verbessere deinen Rekord!</p><div class="actions"><button class="btn" id="battle">⚔️ Battle starten</button><button class="btn secondary" id="practice">🧠 Training Camp</button></div></section><div style="height:16px"></div><section class="grid"><div class="card"><div class="muted tiny">XP GESAMT</div><div class="stat">${db.xp}</div></div><div class="card"><div class="muted tiny">TREFFERQUOTE</div><div class="stat">${s.rate}%</div></div><div class="card"><div class="muted tiny">BESTE COMBO</div><div class="stat">${db.maxStreak} 🔥</div></div></section><div style="height:16px"></div><section class="two"><div class="card"><h2>🎮 Spielmodi</h2><p class="muted">Wähle dein Training. Jede Frage wird anders gestellt.</p><div class="actions"><button class="btn purple" id="errors">🔁 Nur meine Fehler (${missed().length})</button><button class="btn secondary" id="exam">📝 Prüfungscheck</button></div></div><div class="card"><h2>💡 Schon gewusst?</h2><p><strong>c’est</strong> ist die Kurzform von <strong>ce est</strong>. Das <em>e</em> fällt vor dem Vokal weg und ein Apostroph tritt an seine Stelle.</p><span class="tag">Grammar Intel</span></div></section>`);$('#battle').onclick=()=>setup('battle');$('#practice').onclick=()=>setup('train');$('#errors').onclick=()=>setup('errors');$('#exam').onclick=()=>setup('exam')}
function setup(mode){state.mode=mode;state.page='setup';const count=mode==='errors'?missed().length:10;shell(`<section class="card"><span class="tag">MISSION SETUP</span><h1>${{battle:'⚔️ Battle',train:'🧠 Training Camp',errors:'🔁 Revenge Mode',exam:'📝 Prüfungscheck'}[mode]}</h1><p class="muted">Französisch À plus! 1 · bis Unité 1. Im Prüfungscheck gibt es keine Tipps vor der Antwort.</p><label>Spieler-Charakter</label><div class="choicegrid" id="avatars">${[['🥷','Shadow'],['⚽','Striker'],['🎤','MC Vocab']].map(([a,n])=>`<button class="choose ${db.avatar===a?'sel':''}" data-av="${a}"><span class="avatar">${a}</span>${n}</button>`).join('')}</div><label for="topic">Fragen zu</label><select id="topic"><option value="all">Mix: Vokabeln, Grammatik, Transfer</option><option value="Vokabeln">Nur Vokabeln</option><option value="Grammatik">Nur Grammatik</option><option value="Transfer">Nur Transferfragen</option></select><p class="tiny muted">${mode==='errors'?'Offene Fehler: '+count: '10 Fragen · Level 1–3 · Combo ab 3 Treffern'}</p><div class="actions"><button class="btn" id="start">Mission starten →</button><button class="btn secondary" id="back">Zurück</button></div></section>`);document.querySelectorAll('[data-av]').forEach(el=>el.onclick=()=>{db.avatar=el.dataset.av;save();setup(mode)});$('#back').onclick=()=>go('home');$('#start').onclick=()=>start($('#topic').value)}
function start(cat){let candidates=all.filter(q=>cat==='all'||q.category===cat);if(state.mode==='errors')candidates=candidates.filter(q=>missed().includes(q.id));if(!candidates.length){alert('Hier gibt es noch keine offenen Fehler. Spiele zuerst eine Trainingsrunde!');return}let selected=shuffle(candidates);if(state.mode!=='errors'){let ids=new Set();selected=selected.filter(q=>{let root=q.id.replace(/-(fr|de)$/,'');if(ids.has(root))return false;ids.add(root);return true}).slice(0,10)}else selected=selected.slice(0,10);state.queue=selected;state.pos=0;state.answered=false;state.pick=null;state.typed='';state.session={start:new Date().toISOString(),mode:state.mode,avatar:db.avatar,score:0,correct:0,total:selected.length,opponent:shuffle(['CAPTAIN CHAOS','LE SNIPER','MADAME PIXEL','SHADOW BOT'])[0]};go('play')}
function current(){return state.queue[state.pos]};function play(){let q=current(),ses=state.session;if(!q)return finish();let health=Math.round((state.pos/ses.total)*100),tokens=q.type==='order'?shuffle(q.tokens):[];shell(`<section class="card"><div class="row"><span class="tag">${esc(q.category)} · LVL ${q.level}</span><strong>FRAGE ${state.pos+1} / ${ses.total}</strong></div><div style="height:10px"></div><div class="bar"><div class="fill" style="width:${health}%"></div></div><div class="row" style="margin-top:18px"><div><span class="tiny muted">${esc(db.name)}</span><div style="font-size:23px">${db.avatar} ${ses.score} XP</div></div><div style="text-align:right"><span class="tiny muted">VS ${ses.opponent}</span><div style="font-size:23px">🤖 ${Math.max(0,(state.pos-ses.correct)*12)} DMG</div></div></div><h2 class="question">${esc(q.prompt)}</h2><div id="qarea"></div><div id="feedback"></div><div class="actions" id="qactions"></div></section>`);let area=$('#qarea');if(q.type==='mc'){area.innerHTML=q.options.map((o,i)=>`<button class="option" data-choice="${i}">${String.fromCharCode(65+i)} · ${esc(o)}</button>`).join('');document.querySelectorAll('[data-choice]').forEach((b,i)=>b.onclick=()=>submit(q.options[i]));}else if(q.type==='text'){area.innerHTML=`<input class="answer" id="typed" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="Deine Antwort…" aria-label="Deine Antwort"><div class="chips">${['é','è','ê','à','ù','ç','ô','î','’'].map(t=>`<button class="chip" data-key="${t}">${t}</button>`).join('')}</div>`;document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{let inp=$('#typed');let p=inp.selectionStart;inp.setRangeText(b.dataset.key,p,inp.selectionEnd,'end');inp.focus()});$('#typed').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();if($('#typed').value.trim())submit($('#typed').value)}};$('#qactions').innerHTML='<button class="btn" id="check">Antwort prüfen</button>';$('#check').onclick=()=>{if($('#typed').value.trim())submit($('#typed').value)}}else{let picks=[];area.innerHTML=`<div id="assembled" class="mini" style="min-height:50px">Tippe die Wörter in der richtigen Reihenfolge.</div><div class="chips">${tokens.map((t,i)=>`<button class="chip" data-token="${i}">${esc(t)}</button>`).join('')}</div>`;document.querySelectorAll('[data-token]').forEach(b=>b.onclick=()=>{picks.push(tokens[Number(b.dataset.token)]);b.disabled=true;$('#assembled').textContent=picks.join(' ')});$('#qactions').innerHTML='<button class="btn" id="check">Antwort prüfen</button><button class="btn secondary" id="clear">Neu sortieren</button>';$('#check').onclick=()=>{if(picks.length)submit(picks.join(' '))};$('#clear').onclick=()=>play()}}
function submit(value){if(state.answered)return;let q=current(),correct=[q.answer,...(q.alternatives||[])].some(v=>normalize(value)===normalize(v));state.answered=true;state.pick=value;let pts=correct?q.level*10+(db.streak>=2?10:0):0;db.streak=correct?db.streak+1:0;db.maxStreak=Math.max(db.maxStreak,db.streak);db.xp+=pts;state.session.score+=pts;state.session.correct+=Number(correct);db.answers.push({id:q.id,category:q.category,level:q.level,correct,date:new Date().toISOString(),mode:state.mode});save();document.querySelectorAll('#qarea button,#typed,#check,#clear').forEach(b=>b.disabled=true);if(q.type==='mc')document.querySelectorAll('[data-choice]').forEach(b=>{let opt=q.options[Number(b.dataset.choice)];if(opt===q.answer)b.classList.add('correct');else if(opt===value&&!correct)b.classList.add('wrong')});$('#feedback').innerHTML=`<div class="feedback ${correct?'good':'bad'}"><strong>${correct?'✅ Volltreffer! +'+pts+' XP':'❌ Noch nicht ganz!'}</strong><p>Richtige Antwort: <strong>${esc(q.answer)}</strong></p><div class="muted">💡 ${esc(q.tip)}</div>${correct&&db.streak>=3?'<p>🔥 COMBO! '+db.streak+' Treffer in Folge!</p>':''}</div>`;$('#qactions').innerHTML='<button class="btn" id="next">'+(state.pos+1===state.queue.length?'Ergebnis anzeigen':'Nächste Frage →')+'</button>';$('#next').onclick=()=>{state.pos++;state.answered=false;state.pick=null;state.pos>=state.queue.length?finish():play()}}
function finish(){let s=state.session;db.sessions.push({...s,end:new Date().toISOString(),accuracy:Math.round(s.correct/s.total*100)});save();go('result')}function result(){let s=state.session;shell(`<section class="card hero"><span class="tag">MISSION COMPLETE</span><h1>${s.correct>=s.total*.8?'VICTORY ROYALE! 🏆':'GOOD FIGHT! ⚔️'}</h1><p>Gegner: ${esc(s.opponent)}</p><div class="grid"><div><div class="tiny">PUNKTE</div><div class="stat">${s.score} XP</div></div><div><div class="tiny">RICHTIG</div><div class="stat">${s.correct} / ${s.total}</div></div><div><div class="tiny">TREFFERQUOTE</div><div class="stat">${Math.round(s.correct/s.total*100)}%</div></div></div><div class="actions"><button class="btn" id="again">Neue Mission</button><button class="btn secondary" id="stat">Stats ansehen</button></div></section>`);$('#again').onclick=()=>go('home');$('#stat').onclick=()=>go('stats')}
function grammarPage(){shell(`<section class="card"><span class="tag">📘 GRAMMAR ACADEMY</span><h1>Grammatik verstehen</h1><p class="muted">Kurze Regeln, Beispiele und anschließend die passenden Übungen.</p><div class="stack"><div class="mini"><h3>1. c’est – „Das ist“</h3><p><strong>ce + est → c’est.</strong> Vor einem Vokal wird das e ausgelassen und durch einen Apostroph ersetzt.</p><p>Beispiel: <strong>C’est Emma.</strong> = Das ist Emma.</p></div><div class="mini"><h3>2. un oder une?</h3><p><strong>un</strong> steht bei männlichen, <strong>une</strong> bei weiblichen Nomen.</p><p>Beispiel: <strong>un garçon</strong> / <strong>une fille</strong>.</p></div><div class="mini"><h3>3. l’ vor Vokal</h3><p><strong>le / la</strong> wird vor einem Vokal häufig zu <strong>l’</strong>.</p><p>Beispiel: <strong>l’école</strong> – die Schule.</p></div><div class="mini"><h3>🔒 Später: être, avoir und weitere Grammatik</h3><p>Wird erst freigeschaltet, wenn die betreffenden Inhalte im Lernstand erreicht sind.</p></div></div><div class="actions"><button class="btn" id="grammartrain">Grammatik trainieren →</button></div></section>`);$('#grammartrain').onclick=()=>{setup('train');$('#topic').value='Grammatik'}}
function statsPage(){let s=stats(),history=db.sessions.slice(-12);shell(`<section class="card"><span class="tag">PLAYER ANALYTICS</span><h1>Dein Fortschritt 📈</h1><div class="grid"><div class="mini"><div class="tiny muted">GESAMT-XP</div><div class="stat">${db.xp}</div></div><div class="mini"><div class="tiny muted">RICHTIG</div><div class="stat">${s.rate}%</div></div><div class="mini"><div class="tiny muted">BATTLES</div><div class="stat">${db.sessions.length}</div></div></div><h2 style="margin-top:30px">Lernkurve</h2><div class="legend">Trefferquote pro Session · zuletzt 12 Sessions</div><canvas id="curve" class="chart"></canvas><h2>Deine Themen</h2>${['Vokabeln','Grammatik','Transfer'].map(c=>{let a=db.answers.filter(x=>x.category===c),p=a.length?Math.round(a.filter(x=>x.correct).length/a.length*100):0;return `<div class="labels"><span>${c}</span><strong>${a.length?p+'%':'Noch keine Antworten'}</strong></div><div class="bar"><div class="fill" style="width:${p}%"></div></div>`}).join('')}<h2 style="margin-top:30px">Letzte Ergebnisse</h2>${history.length?`<div class="stack">${history.slice().reverse().map(h=>`<div class="mini row"><div><strong>${new Date(h.end).toLocaleDateString('de-DE')}</strong><div class="tiny muted">${esc(h.mode)} · ${h.correct}/${h.total} richtig</div></div><strong>${h.score} XP · ${h.accuracy}%</strong></div>`).join('')}</div>`:'<p class="muted">Nach deinem ersten Battle erscheint hier deine Lernkurve.</p>'}</section>`);draw(history)}function draw(history){let c=$('#curve'),dpr=devicePixelRatio||1,w=c.clientWidth||600,h=185;c.width=w*dpr;c.height=h*dpr;let ctx=c.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);ctx.strokeStyle='#39486d';for(let k=0;k<5;k++){let y=12+(h-28)*k/4;ctx.beginPath();ctx.moveTo(25,y);ctx.lineTo(w-10,y);ctx.stroke()}if(!history.length){ctx.fillStyle='#9da9ca';ctx.font='14px sans-serif';ctx.fillText('Noch keine Daten',30,93);return}ctx.beginPath();ctx.strokeStyle='#d8ff48';ctx.lineWidth=3;history.forEach((a,i)=>{let x=30+i*(w-50)/Math.max(1,history.length-1),y=12+(100-a.accuracy)/100*(h-28);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();history.forEach((a,i)=>{let x=30+i*(w-50)/Math.max(1,history.length-1),y=12+(100-a.accuracy)/100*(h-28);ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fillStyle='#d8ff48';ctx.fill()})}
function settings(){shell(`<section class="card"><span class="tag">PROFILE SETTINGS</span><h1>Spielerprofil</h1><label for="name">Spielername (keine echten Nachnamen)</label><input class="answer" id="name" maxlength="24" value="${esc(db.name)}"><label for="chapter">Lernstand</label><select id="chapter"><option value="1">À plus! 1 – bis Unité 1</option></select><p class="tiny muted">Weitere Lektionen folgen erst nach Prüfung des Lernmaterials.</p><div class="actions"><button class="btn" id="save">Profil speichern</button><button class="btn danger" id="reset">Fortschritt löschen</button></div><div class="divider"></div><p class="muted tiny">V1 speichert ausschließlich lokal auf diesem Gerät. Es gibt noch keine echte Anmeldung, keine Cloud-Synchronisierung und keine gemeinsame Bestenliste. Die spätere Supabase-Verbindung muss mit sicherer Authentifizierung und Row-Level-Security eingerichtet werden.</p></section>`);$('#save').onclick=()=>{db.name=$('#name').value.trim().slice(0,24)||'Bruno';save();go('home')};$('#reset').onclick=()=>{if(confirm('Wirklich alle lokalen Punkte, Antworten und Statistiken löschen?')){db=empty();save();go('home')}}}
render();
</script></body></html>
